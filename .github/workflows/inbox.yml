name: 공유한 사진으로 후기 만들기

# 폰 갤러리 -> 공유 -> ntfy 로 보낸 사진을 5분마다 확인해서 후기 글을 만듭니다.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "업로드 페이지가 보낸 직후 (기다리지 않음)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: AI가 바빠서 미뤄 둔 후기 다시 시도
        if: github.event.inputs.now != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=%EB%8B%A4%EC%8B%9C%EC%8B%9C%EB%8F%84" --jq '.[].number' || true); do
            echo "후기 다시 시도: #$n"; gh workflow run review.yml -R "$GITHUB_REPOSITORY" -f issue="$n" || true
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow anthropic imageio-ffmpeg
      - name: 받은 사진 확인 + 후기 쓰기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_UPLOAD_TOPIC: ${{ secrets.NTFY_UPLOAD_TOPIC }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOW: ${{ github.event.inputs.now }}
          GEMINI_MAX_WAIT: "300"
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python cloud_inbox.py
      - name: 사이트에 올리기
        run: |
          git config user.name "blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs inbox_state.json 2>/dev/null || git add docs
          git diff --cached --quiet && exit 0
          git commit -m "공유 사진 후기 $(date +%F)"
          git pull --rebase -q
          git push
      - name: 폰 알림 보내기
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py
