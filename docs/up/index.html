<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>후기 올리기</title>
<style>
 body{margin:0;background:#f4f5f7;font-family:-apple-system,'Malgun Gothic',sans-serif;color:#222}
 header{background:#03c75a;color:#fff;padding:16px}header h1{margin:0;font-size:20px}
 header p{margin:6px 0 0;font-size:13px;opacity:.95}
 main{max-width:560px;margin:0 auto;padding:14px}
 .big{display:block;width:100%;padding:22px;font-size:20px;font-weight:700;border:0;border-radius:14px;background:#03c75a;color:#fff;margin:10px 0}
 .big:disabled{background:#9bd8b4}
 .pick{background:#fff;color:#03a14a;border:2px dashed #03c75a}
 .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
 .thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
 input[type=text]{width:100%;box-sizing:border-box;padding:14px;font-size:16px;border:1px solid #ccc;border-radius:10px}
 #msg{text-align:center;font-size:16px;line-height:1.6;margin-top:10px;white-space:pre-line}
 .card{background:#fff;border-radius:12px;padding:14px;margin:10px 0}
 small{color:#888}
 a{color:#03a14a}
</style></head><body>
<header><h1>📷 내돈내산 후기 올리기</h1><p>사진만 고르고 [보내기] → 5~15분 뒤 폰 알림</p></header>
<main>
 <div class="card hidden" id="setup" style="display:none">
  <b>처음 한 번만</b><br><small>받은 "사진 받는 주소"를 넣어 주세요 (sesang-up-로 시작). 이 폰에 저장됩니다.</small>
  <input type="text" id="topic" placeholder="sesang-up-..." autocapitalize="off" autocomplete="off" style="margin-top:8px">
  <button class="big" id="saveTopic">저장</button>
 </div>
 <div id="app" style="display:none">
  <input type="file" id="files" accept="image/*" multiple hidden>
  <button class="big pick" id="pick">＋ 물건 사진 고르기</button>
  <div class="thumbs" id="thumbs"></div>
  <input type="text" id="memo" placeholder="메모 (선택) 예: 쿠팡 2만원, 2주 써봄">
  <button class="big" id="send" disabled>보내기</button>
  <div id="msg"></div>
  <details class="card" style="margin-top:20px"><summary><b>⚡ 바로 쓰기 설정</b> <small id="keyState"></small></summary>
   <small>GitHub에서 만든 키(github_pat_…)를 한 번 붙여넣으면, 보내자마자 글을 씁니다.</small>
   <input type="text" id="key" placeholder="github_pat_..." autocapitalize="off" autocomplete="off" style="margin-top:8px">
   <button class="big" id="saveKey" style="padding:14px;font-size:16px">키 저장</button></details>
  <p style="text-align:center;margin-top:24px"><a href="../">📝 글 창고 보기</a></p>
 </div>
</main>
<script>
const $=s=>document.querySelector(s);let files=[];
const topic=()=>localStorage.getItem("up_topic")||"";
function show(){const ok=/^sesang-up-[a-z0-9]+$/.test(topic());$("#setup").style.display=ok?"none":"block";$("#app").style.display=ok?"block":"none"}
$("#saveTopic").onclick=()=>{const t=$("#topic").value.trim().toLowerCase();
  if(!/^sesang-up-[a-z0-9]+$/.test(t)){alert("주소가 맞지 않아요. sesang-up- 으로 시작합니다.");return}
  localStorage.setItem("up_topic",t);show()};
$("#pick").onclick=()=>$("#files").click();
$("#files").onchange=e=>{files=[...files,...e.target.files].slice(0,8);e.target.value="";
  $("#thumbs").innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}">`).join("");
  $("#send").disabled=!files.length;$("#send").textContent=files.length?`보내기 (사진 ${files.length}장)`:"보내기";$("#msg").textContent=""};
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("사진 변환 실패")),"image/jpeg",.88)};
  im.onerror=()=>rej(new Error("사진을 읽지 못했어요"));im.src=u})}
$("#send").onclick=async()=>{
  const b=$("#send");b.disabled=true;const url="https://ntfy.sh/"+topic();
  try{
    const memo=$("#memo").value.trim();
    if(memo){const r=await fetch(url,{method:"POST",body:memo});if(!r.ok)throw new Error("메모 전송 실패 "+r.status)}
    for(let i=0;i<files.length;i++){
      $("#msg").textContent=`보내는 중… ${i+1}/${files.length}`;
      const blob=await shrink(files[i]);
      const r=await fetch(url,{method:"PUT",body:blob,headers:{"Filename":`photo${i+1}.jpg`}});
      if(!r.ok)throw new Error("사진 전송 실패 "+r.status)}
    const go=await kick();
    $("#msg").textContent=go?"✅ 보냈어요! 바로 글을 쓰기 시작했어요.\n2~3분 뒤 \"후기 글 완성\" 알림이 옵니다.":
      "✅ 보냈어요!\n자동 확인 때 글을 씁니다 (늦으면 몇 시간).\n바로 쓰게 하려면 아래 [바로 쓰기 설정]을 해 주세요.";
    files=[];$("#thumbs").innerHTML="";$("#memo").value="";b.textContent="보내기"
  }catch(e){$("#msg").textContent="❌ "+e.message+"\n인터넷을 확인하고 다시 눌러 주세요.";b.disabled=false}};
// start the cloud job right away (GitHub's own timer is unreliable). Token: Actions write, this repo only.
async function kick(){const k=localStorage.getItem("gh_key");if(!k)return false;
  try{const r=await fetch("https://api.github.com/repos/t2520176-oss/sesang-blog/actions/workflows/inbox.yml/dispatches",
    {method:"POST",headers:{"Authorization":"Bearer "+k,"Accept":"application/vnd.github+json"},body:JSON.stringify({ref:"main",inputs:{now:"1"}})});
    return r.status===204}catch(e){return false}}
{const h=new URLSearchParams(location.hash.slice(1));   // one-time setup link: #t=topic&k=token
 if(/^sesang-up-[a-z0-9]+$/.test(h.get("t")||""))localStorage.setItem("up_topic",h.get("t"));
 if(/^github_pat_\w+$/.test(h.get("k")||""))localStorage.setItem("gh_key",h.get("k"));
 if(location.hash)history.replaceState(null,"",location.pathname)}
$("#saveKey").onclick=()=>{const k=$("#key").value.trim();if(!/^github_pat_\w+$/.test(k)){alert("github_pat_ 로 시작하는 키를 붙여넣어 주세요");return}
  localStorage.setItem("gh_key",k);$("#key").value="";keyInfo();alert("저장됨! 이제 보내면 바로 글을 씁니다.")};
function keyInfo(){$("#keyState").textContent=localStorage.getItem("gh_key")?"✅ 설정됨 (보내면 바로 씀)":"아직 안 함"}
keyInfo();
show();
</script>
</body></html>
